name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.prep.outputs.image_owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercased image owner
        id: prep
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_owner=${IMAGE_OWNER}" >> "$GITHUB_OUTPUT"

      - name: Build and push hotelia-server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.image_owner }}/hotelia-server:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.image_owner }}/hotelia-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push hotelia-client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.image_owner }}/hotelia-client:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.image_owner }}/hotelia-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ vars.SSH_USER || 'hotelia-deploy' }}
        run: |
          mkdir -p ~/.ssh
          # Clean private key to ensure proper Unix line endings and trailing newline
          printf "%s\n" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "Connecting to $SSH_USER@$SSH_HOST on port $SSH_PORT..."

          ssh -i ~/.ssh/id_deploy \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" bash -s << 'EOF'
            set -e
            echo "Successfully authenticated as $(whoami) on $(hostname)"
            cd "${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/var/www/hotel-saas' }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export HOTELIA_CLIENT_IMAGE="ghcr.io/${{ needs.build-and-push.outputs.image_owner }}/hotelia-client:latest"
            export HOTELIA_SERVER_IMAGE="ghcr.io/${{ needs.build-and-push.outputs.image_owner }}/hotelia-server:latest"
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Deployment completed successfully!"
          EOF

