services:
  hotelia-redis:
    container_name: hotelia-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  hotelia-server:
    container_name: hotelia-server
    image: ${HOTELIA_SERVER_IMAGE:-hotelia-server:latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:4010:4000"
    depends_on:
      - hotelia-redis

  hotelia-client:
    container_name: hotelia-client
    image: ${HOTELIA_CLIENT_IMAGE:-hotelia-client:latest}
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - hotelia-server

volumes:
  redis-data:


